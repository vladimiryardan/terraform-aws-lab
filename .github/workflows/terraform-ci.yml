name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write


jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    env:
      TF_VAR_environment: ${{ matrix.environment }}
      TF_VAR_vpc_cidr: ${{ matrix.vpc_cidr }}
      TF_VAR_public_subnet_cidr: ${{ matrix.public_subnet_cidr }}
      TF_VAR_ssh_allowed_cidr: "103.60.171.224/32"
      TF_VAR_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDUMMYKEYFORCIVALIDATIONONLY terraform-ci"

    strategy:
      matrix:
        include:
          - environment: dev
            vpc_cidr: "10.0.0.0/16"
            public_subnet_cidr: "10.0.1.0/24"

          - environment: staging
            vpc_cidr: "10.1.0.0/16"
            public_subnet_cidr: "10.1.1.0/24"

          - environment: prod
            vpc_cidr: "10.2.0.0/16"
            public_subnet_cidr: "10.2.1.0/24"
            availability_zone: "us-east-1a"

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789655958476:role/terraform-github-actions
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../..

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 7        